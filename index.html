<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Puzzle Parking Simulator - Strictly No Long Stay at Level 1</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Plotly.js CDN -->
  <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
  <style>
    .grid-btn {
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .status-has-car {
      background-color: #eff6ff; /* pastel light blue */
      border-color: #bfdbfe;
      color: #1d4ed8;
    }
    .status-pickup {
      background-color: #fefce8; /* pastel light yellow */
      border-color: #fef08a;
      color: #a16207;
    }
    .status-empty {
      background-color: #ffffff; /* pure white */
      border-color: #cbd5e1;
      color: #475569;
    }
    .status-active-target {
      background-color: #22c55e !important; /* Vibrant highlight green */
      border-color: #16a34a !important;
      color: #ffffff !important;
      transform: scale(1.03);
      box-shadow: 0 10px 15px -3px rgba(34, 197, 94, 0.4);
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans p-4 md:p-8">

  <div class="max-w-6xl mx-auto space-y-6">

    <!-- HEADER & CONTROLS AT TOP -->
    <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200">
      <div class="flex flex-col lg:flex-row lg:items-center justify-between gap-6">
        
        <!-- Input Parameters -->
        <div class="flex flex-wrap items-center gap-6">
          <div>
            <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">Loại xe vào</label>
            <select id="vehicleType" onchange="updateAnalytics()" class="bg-slate-100 border border-slate-300 text-slate-800 text-sm rounded-lg focus:ring-emerald-500 focus:border-emerald-500 block p-2.5 font-medium">
              <option value="SUV">🚘 SUV / Bán tải (Nặng)</option>
              <option value="Sedan" selected>🚗 Sedan / Compact (Nhẹ)</option>
            </select>
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">Thời gian gửi dự kiến</label>
            <div class="flex items-center gap-2">
              <input type="number" id="stayDuration" value="48" min="0.5" step="0.5" onchange="updateAnalytics()" class="bg-slate-100 border border-slate-300 text-slate-800 text-sm rounded-lg focus:ring-emerald-500 focus:border-emerald-500 block w-24 p-2.5 font-medium">
              <span class="text-sm font-medium text-slate-600">giờ</span>
            </div>
          </div>
        </div>

        <!-- Optimal Target Banner & Action Button -->
        <div class="flex items-center gap-4 bg-slate-50 p-3 rounded-xl border border-slate-200">
          <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-lg bg-emerald-500 text-white flex items-center justify-center font-bold text-lg">
              ✨
            </div>
            <div>
              <div class="text-xs font-semibold text-emerald-600 uppercase tracking-wider">Ô tối ưu tự động phát hiện</div>
              <div id="optimalBanner" class="text-sm font-bold text-slate-900">Đang tính toán...</div>
            </div>
          </div>

          <button id="startSimBtn" onclick="runSimulation()" class="ml-4 bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-6 py-3 rounded-xl shadow-md transition hover:shadow-lg flex items-center gap-2">
            <span>►</span> Bắt đầu di chuyển
          </button>
        </div>

      </div>

      <!-- Action Status Text -->
      <div id="statusAlert" class="mt-4 p-3 rounded-lg bg-slate-100 text-slate-700 text-sm font-medium hidden">
        Sẵn sàng vận hành.
      </div>
    </div>

    <!-- 2D INTERACTIVE MATRIX MODEL -->
    <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200">
      <div class="flex items-center justify-between mb-4">
        <h2 class="text-base font-bold text-slate-800 flex items-center gap-2">
          <span>🧩</span> Mô hình bãi đỗ xe Puzzle (3 Tầng × 4 Cột)
        </h2>
        <div class="flex items-center gap-4 text-xs font-medium">
          <span class="flex items-center gap-1.5"><span class="w-3 h-3 rounded-full bg-blue-100 border border-blue-300 inline-block"></span> Có xe</span>
          <span class="flex items-center gap-1.5"><span class="w-3 h-3 rounded-full bg-yellow-100 border border-yellow-300 inline-block"></span> Đón xe</span>
          <span class="flex items-center gap-1.5"><span class="w-3 h-3 rounded-full bg-white border border-slate-300 inline-block"></span> Ô trống</span>
          <span class="flex items-center gap-1.5"><span class="w-3 h-3 rounded-full bg-emerald-500 inline-block"></span> Ô đang di chuyển</span>
        </div>
      </div>

      <div id="gridContainer" class="grid grid-cols-4 gap-3">
        <!-- Rendered by JS -->
      </div>
    </div>

    <!-- CHARTS SECTION -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
      <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200">
        <div id="stepsChart" class="w-full h-72"></div>
      </div>
      <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200">
        <div id="scoreChart" class="w-full h-72"></div>
      </div>
    </div>

  </div>

  <script>
    const ROWS = 3;
    const COLS = 4;

    // Initial Grid Setup
    let gridState = [
      ['HAS_CAR', 'PICKUP', 'EMPTY_SLOT', 'HAS_CAR'],  // Tier 1
      ['HAS_CAR', 'EMPTY_SLOT', 'HAS_CAR', 'PICKUP'],   // Tier 2
      ['PICKUP', 'HAS_CAR', 'HAS_CAR', 'HAS_CAR']      // Tier 3
    ];

    let activeTargetPos = null; // { r, c }
    let isSimulating = false;

    const STATUS_MAP = {
      'HAS_CAR': { label: '🚘 CÓ XE', class: 'status-has-car', next: 'PICKUP' },
      'PICKUP': { label: '🟧 ĐÓN XE', class: 'status-pickup', next: 'EMPTY_SLOT' },
      'EMPTY_SLOT': { label: '🟩 Ô TRỐNG', class: 'status-empty', next: 'HAS_CAR' }
    };

    function renderGrid() {
      const container = document.getElementById('gridContainer');
      container.innerHTML = '';

      for (let r = ROWS - 1; r >= 0; r--) {
        for (let c = 0; c < COLS; c++) {
          const statusKey = gridState[r][c];
          const cfg = STATUS_MAP[statusKey];

          const btn = document.createElement('button');
          btn.type = 'button';
          
          let isTarget = activeTargetPos && activeTargetPos.r === r && activeTargetPos.c === c;
          
          btn.className = `grid-btn h-16 rounded-xl border-2 font-bold text-sm flex flex-col items-center justify-center gap-0.5 shadow-sm ${
            isTarget ? 'status-active-target' : cfg.class
          }`;

          btn.innerHTML = `
            <span>${cfg.label}</span>
            <span class="text-[10px] opacity-60">T${r+1}-C${c+1}</span>
          `;

          btn.onclick = () => {
            if (isSimulating) return;
            gridState[r][c] = cfg.next;
            renderGrid();
            updateAnalytics();
          };

          container.appendChild(btn);
        }
      }
    }

    function calculateMetrics() {
      const vehicleType = document.getElementById('vehicleType').value;
      const duration = parseFloat(document.getElementById('stayDuration').value) || 1.0;
      const w1 = 0.40, w2 = 0.35, w3 = 0.25;

      const records = [];

      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          if (gridState[r][c] === 'PICKUP') {
            
            // Steps Calculation
            let steps = 0;
            for (let rowBelow = 0; rowBelow < r; rowBelow++) {
              let emptyCol = gridState[rowBelow].indexOf('EMPTY_SLOT');
              if (emptyCol !== -1) {
                steps += Math.abs(c - emptyCol);
              }
            }

            // Size Penalty
            let pSize = 0;
            if (vehicleType === "SUV") {
              pSize = (r === 2) ? 0 : 100;
            } else {
              pSize = (r < 2) ? 0 : 20; 
            }

            // Steps Penalty
            let pSteps = Math.min(100, steps * 30 + r * 15);

            // Time Penalty (RE-CALIBRATED: Heavy exponential scaling to completely block T1 for >= 48h)
            let pTime = 0;
            if (duration >= 48.0) {
              if (r === 0) pTime = 200;  // Absolute maximum penalty for Tier 1 at 48h+
              else if (r === 1) pTime = 40;
              else pTime = 0;
            } else if (duration > 2.0) {
              if (r === 0) pTime = Math.min(150, duration * 3.5);
              else if (r === 1) pTime = 25;
              else pTime = 0;
            } else {
              pTime = r * 50; // Short stay heavily penalizes upper tiers
            }

            let pTotal = (w1 * pSize) + (w2 * pSteps) + (w3 * pTime);

            records.push({
              r, c,
              tier: r + 1,
              col: c + 1,
              label: `Tầng ${r + 1} - Cột ${c + 1}`,
              steps,
              pTotal: Number(pTotal.toFixed(1))
            });
          }
        }
      }

      records.sort((a, b) => a.pTotal - b.pTotal);
      return records;
    }

    function updateAnalytics() {
      const records = calculateMetrics();
      const banner = document.getElementById('optimalBanner');
      const startBtn = document.getElementById('startSimBtn');

      if (records.length > 0) {
        const best = records[0];
        banner.innerText = `${best.label} (Điểm: ${best.pTotal} | ${best.steps} bước)`;
        startBtn.disabled = false;
        startBtn.classList.remove('opacity-50', 'cursor-not-allowed');
      } else {
        banner.innerText = 'Không có ô ĐÓN XE nào';
        startBtn.disabled = true;
        startBtn.classList.add('opacity-50', 'cursor-not-allowed');
      }

      // Render Charts
      const labels = records.map(r => r.label);
      const stepsData = records.map(r => r.steps);
      const scoreData = records.map(r => r.pTotal);

      Plotly.newPlot('stepsChart', [{
        x: labels,
        y: stepsData,
        type: 'bar',
        marker: { color: '#3b82f6' },
        text: stepsData.map(String),
        textposition: 'auto'
      }], {
        title: { text: '<b>1. Số bước di chuyển</b>', font: { size: 14 } },
        margin: { t: 40, b: 40, l: 40, r: 20 },
        yaxis: { title: 'Bước trượt' }
      }, { responsive: true, displayModeBar: false });

      Plotly.newPlot('scoreChart', [{
        x: labels,
        y: scoreData,
        type: 'bar',
        marker: { color: '#ef4444' },
        text: scoreData.map(String),
        textposition: 'auto'
      }], {
        title: { text: '<b>2. Hàm mục tiêu</b>', font: { size: 14 } },
        margin: { t: 40, b: 40, l: 40, r: 20 },
        yaxis: { title: 'Điểm phạt' }
      }, { responsive: true, displayModeBar: false });
    }

    async function runSimulation() {
      if (isSimulating) return;

      const records = calculateMetrics();
      if (records.length === 0) return;

      isSimulating = true;
      const target = records[0];
      const targetR = target.r;
      const targetC = target.c;

      const alertBox = document.getElementById('statusAlert');
      alertBox.classList.remove('hidden');

      activeTargetPos = { r: targetR, c: targetC };
      renderGrid();

      // Phase 1: Horizontal Sliding for clearing path
      for (let r = 0; r < targetR; r++) {
        let emptyC = gridState[r].indexOf('EMPTY_SLOT');
        if (emptyC !== -1 && emptyC !== targetC) {
          let dir = emptyC < targetC ? 1 : -1;
          let currC = emptyC;

          while (currC !== targetC) {
            let nextC = currC + dir;
            alertBox.innerHTML = `⏳ <b>Tầng ${r + 1}:</b> Trượt ô từ Cột ${nextC + 1} ➔ Cột ${currC + 1}...`;

            await new Promise(res => setTimeout(res, 1200));

            gridState[r][currC] = gridState[r][nextC];
            gridState[r][nextC] = 'EMPTY_SLOT';
            renderGrid();

            currC = nextC;
          }
        }
      }

      // Phase 2: Lowering target vehicle down to Ground Level (Tier 1)
      alertBox.innerHTML = `⬇️ <b>Hạ ô thành công:</b> Đưa xe từ ${target.label} thẳng xuống Tầng 1...`;
      await new Promise(res => setTimeout(res, 1500));

      if (targetR > 0) {
        gridState[0][targetC] = gridState[targetR][targetC];
        gridState[targetR][targetC] = 'EMPTY_SLOT';
      }

      // Phase 3: Set target vehicle at Ground Level to "HAS_CAR"
      gridState[0][targetC] = 'HAS_CAR';
      activeTargetPos = { r: 0, c: targetC }; // Keep focus at T1
      renderGrid();

      // Phase 4: Return Empty Slot Back to Original Tier (if original was Tier 2 or Tier 3)
      if (targetR > 0) {
        alertBox.innerHTML = `🔄 <b>Đảo vị trí:</b> Trả ô trống từ Tầng 1 trở lại Tầng ${targetR + 1} (vị trí gốc)...`;
        await new Promise(res => setTimeout(res, 1400));

        // Swap Tier 1 empty/car back up to targetR
        gridState[targetR][targetC] = 'EMPTY_SLOT';
        gridState[0][targetC] = 'HAS_CAR';
      }

      activeTargetPos = null;
      renderGrid();
      updateAnalytics();

      alertBox.innerHTML = `✅ <b>Hoàn tất:</b> Ô đỗ đã hạ xuống mặt đất, đổi thành <b>CÓ XE</b> và ô trống đã được trả về lại Tầng ${targetR + 1}.`;
      isSimulating = false;
    }

    // Initial load
    renderGrid();
    updateAnalytics();
  </script>
</body>
</html>
